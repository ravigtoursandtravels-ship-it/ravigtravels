<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Domestic Trip Booking | Ravi G Tours and Travels</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="whatsapp-booking.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body data-flow="domestic">
  <main class="cg-page">
    <section class="cg-app">
      <header class="cg-header">
        <div class="cg-brand">
          <img src="images/logo.png" alt="Ravi G Tours and Travels">
          <div>
            <h1>Ravi G Tours and Travels</h1>
            <p><span></span> Guru Prakash on Desk</p>
          </div>
        </div>
        <div class="header-actions">
          <a class="call-btn" href="tel:+919944165207" aria-label="Call Ravi G Tours and Travels at 99441 65207">
            <i class="bi bi-telephone-fill"></i>
            <span>Call</span>
          </a>
          <button class="reset-btn" onclick="resetBooking()" aria-label="Reset booking">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </header>

      <section class="cg-body">
        <img src="images/logo.png" class="watermark" alt="">
        <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <div id="screen"></div>
      </section>
    </section>
  </main>

  <script src="whatsapp-booking.js"></script>
</body>
</html>
